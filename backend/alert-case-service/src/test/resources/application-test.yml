spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finrisk_test
    username: finrisk
    password: ${POSTGRES_PASSWORD}
    # Plusieurs contextes Spring caches = plusieurs pools ouverts en meme
    # temps : plafond strict pour ne pas epuiser PostgreSQL (100 connexions,
    # deja sollicitees par les services demares).
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# L'agent nocturne ne tourne PAS pendant les tests (pas de balayage
# surprise ni d'appel sortant a 17h pendant une suite).
night-agent:
  enabled: false

logging:
  level:
    tn.finrisk: INFO
    org.hibernate.SQL: WARN
