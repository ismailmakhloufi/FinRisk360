spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finrisk_test
    username: finrisk
    password: ${POSTGRES_PASSWORD}
    # Borne stricte : la suite cree PLUSIEURS contextes Spring caches,
    # chacun gardant son pool ouvert — sans plafond on epuise les 100
    # connexions de PostgreSQL (les services demares en partent deja).
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    tn.finrisk: INFO
    org.hibernate.SQL: WARN
