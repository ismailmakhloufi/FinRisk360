server:
  address: ${SERVER_BIND_ADDRESS:127.0.0.1}
  port: 8081

spring:
  application:
    name: customer-service

  datasource:
    url: jdbc:postgresql://localhost:5432/finrisk
    username: finrisk
    password: ${POSTGRES_PASSWORD}

  jpa:
    # Le schema SQL (postgres/02-schema.sql) est la source de verite :
    # Hibernate ne cree rien, il VERIFIE seulement que les entites correspondent.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    tn.finrisk: INFO
    org.hibernate.SQL: DEBUG
