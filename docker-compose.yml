services:
  postgres:
    image: postgres:17
    container_name: finrisk-postgres
    environment:
      POSTGRES_DB: finrisk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configurez POSTGRES_ADMIN_PASSWORD}
      FINRISK_DB_PASSWORD: ${POSTGRES_PASSWORD:?Configurez POSTGRES_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Configurez AI_DB_PASSWORD}
      FINRISK_BOOTSTRAP_ADMIN_PASSWORD: ${FINRISK_BOOTSTRAP_ADMIN_PASSWORD:?Configurez FINRISK_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finrisk-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres:/opt/finrisk/sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finrisk"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: finrisk-adminer
    ports:
      - "127.0.0.1:5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finrisk-pgdata:
